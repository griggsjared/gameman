name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Cache test ROMs
        id: cache-test-roms
        uses: actions/cache@v4
        with:
          path: test-roms
          key: test-roms-v1

      - name: Download Blargg CPU test ROMs
        if: steps.cache-test-roms.outputs.cache-hit != 'true'
        run: |
          mkdir -p test-roms
          curl -L -o /tmp/cpu_instrs.zip \
            https://gbdev.gg8.se/files/roms/blargg-gb-tests/cpu_instrs.zip
          unzip -o /tmp/cpu_instrs.zip -d test-roms/
          rm /tmp/cpu_instrs.zip

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D clippy::all -W clippy::pedantic
      - run: cargo check
      - run: cargo test
